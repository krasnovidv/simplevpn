<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RKNPNH — Жидкий хром</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#E9E6EF}a{color:#6B4DFF}a:hover{color:#FF4FD8}*{-webkit-tap-highlight-color:transparent}button{font:inherit}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="y2k/core.jsx"></script>
<script type="text/babel" src="y2k/heroes.jsx"></script>
<script type="text/babel" src="y2k/screens.jsx"></script>
<script type="text/babel">
function board(id, label, dark, screen, state) {
  return (
    <DCArtboard key={id} id={id} label={label} width={412} height={880} style={{ background: 'transparent', boxShadow: 'none', borderRadius: 44 }}>
      <App dir="chrome" dark={dark} initialScreen={screen} initialState={state}></App>
    </DCArtboard>
  );
}
const SCREENS = [
  ['onb', 'Первый запуск → разрешение VPN', 'onboarding', 'idle'],
  ['main', 'Главный · жми на сферу', 'main', 'idle'],
  ['main-on', 'Главный · подключено (жми — отключится)', 'main', 'connected'],
  ['split', 'Раздельное туннелирование', 'split', 'connected'],
  ['settings', 'Настройки', 'settings', 'connected'],
  ['widget', 'Рабочий стол: виджеты + уведомление', 'widget', 'connected'],
  ['error', 'Нет сети', 'error', 'idle'],
];
function Root() {
  return (
    <DesignCanvas>
      <DCSection id="dark" title="Жидкий хром · тёмная" subtitle="Всё живое: жми на сферу, кнопки и вкладки. Подключение ~2,6 с, отключение ~1,3 с.">
        {SCREENS.map(([id, l, s, st]) => board('d-' + id, l, true, s, st))}
      </DCSection>
      <DCSection id="light" title="Жидкий хром · светлая" subtitle="Те же экраны в светлой теме. Тему можно переключить и прямо в Настройках.">
        {SCREENS.map(([id, l, s, st]) => board('l-' + id, l, false, s, st))}
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root></Root>);
</script>
</body>
</html>
