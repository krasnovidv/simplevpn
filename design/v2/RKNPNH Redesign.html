<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RKNPNH — Редизайн · Y2K</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700;800&family=Dela+Gothic+One&family=Onest:wght@500;600;700;800;900&family=Rubik:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#E9E6EF}a{color:#6B4DFF}a:hover{color:#FF3DF2}*{-webkit-tap-highlight-color:transparent}button{font:inherit}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="y2k/core.jsx"></script>
<script type="text/babel" src="y2k/heroes.jsx"></script>
<script type="text/babel" src="y2k/screens.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": true
}/*EDITMODE-END*/;

const INFO = {
  chrome: 'Жидкий металл, который сливается в голографическую сферу. Перламутр, мягкие меш-градиенты, Unbounded + Manrope. Самое «премиальное» из трёх.',
  acid: 'Рейв-глобус с глазом слежки, который надевает очки, когда ты спрятался. Лайм + фуксия, сетка-горизонт, бегущая лента. Самое громкое.',
  jelly: 'Желейный персонаж, который морфится и строит рожи под каждое состояние. Конфетные цвета, «надутые» карточки. Самое дружелюбное.',
};

function board({ dir, dark, screen, state, label, id }) {
  return (
    <DCArtboard key={id} id={id} label={label} width={412} height={880} style={{ background: 'transparent', boxShadow: 'none', borderRadius: 44 }}>
      <App dir={dir} dark={dark} initialScreen={screen} initialState={state}></App>
    </DCArtboard>
  );
}

function Root() {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const d = tw.dark;
  return (
    <>
      <TweaksPanel title="Tweaks">
        <TweakSection title="Тема">
          <TweakRadio label="Основная тема" value={d ? 'dark' : 'light'} onChange={v => setTweak('dark', v === 'dark')} options={[{ value: 'dark', label: 'Тёмная' }, { value: 'light', label: 'Светлая' }]}></TweakRadio>
        </TweakSection>
      </TweaksPanel>
      <DesignCanvas>
        {['chrome', 'acid', 'jelly'].map((dir, i) => (
          <DCSection key={dir} id={dir} title={`0${i + 1} · ${DIRS[dir].name}`} subtitle={INFO[dir] + ' Всё кликабельно: жми на объект, переключай вкладки.'}>
            {board({ id: dir + '-main', dir, dark: d, screen: 'main', state: 'idle', label: 'Главный — жми на объект' })}
            {board({ id: dir + '-main2', dir, dark: !d, screen: 'main', state: 'connected', label: 'Главный · подключено · другая тема' })}
            {board({ id: dir + '-split', dir, dark: d, screen: 'split', state: 'connected', label: 'Раздельное туннелирование' })}
            {board({ id: dir + '-settings', dir, dark: d, screen: 'settings', state: 'connected', label: 'Настройки' })}
            {board({ id: dir + '-widget', dir, dark: d, screen: 'widget', state: 'connected', label: 'Виджеты + уведомление' })}
            {board({ id: dir + '-error', dir, dark: d, screen: 'error', state: 'idle', label: 'Нет сети' })}
          </DCSection>
        ))}
      </DesignCanvas>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Root></Root>);
</script>
</body>
</html>
