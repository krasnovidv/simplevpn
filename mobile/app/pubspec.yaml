name: simplevpn
description: SimpleVPN - DPI-resistant VPN client
publish_to: 'none'
version: 2.0.0+20

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  mobile_scanner: ^5.0.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0
  flutter_riverpod: ^2.4.0
  package_info_plus: ^8.0.0
  http: ^1.2.0
  crypto: ^3.0.0
  qr_flutter: ^4.1.0
  app_links: ^6.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # SIL Open Font License 1.1 — see assets/fonts/OFL-*.txt
    - family: Unbounded
      fonts:
        - asset: assets/fonts/Unbounded-700.ttf
          weight: 700
        - asset: assets/fonts/Unbounded-800.ttf
          weight: 800
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
